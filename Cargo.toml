[package]
name = "action-orc"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tigran Kirakosov <tkirakosov96@gmail.com>"]
description = "A declarative DSL for composing hierarchical execution graphs in Rust."
repository = "https://github.com/TigranKirakosov/action_orc"
readme = "README.md"
keywords = ["dsl", "graph", "workflow"]
categories = ["development-tools"]
license = "MIT OR Apache-2.0"
rust-version = "1.95.0"

[workspace]
resolver = "2"
members = [
    "core",
    "engine",
    "macros",
]
[dependencies]
action-orc-core = { path = "core", version = "0.1.0" }
action-orc-engine = { path = "engine", version = "0.1.0" }
action-orc-macros = { path = "macros", version = "0.1.0" }

[workspace.dependencies]
action-orc-core = { path = "core", version = "0.1.0" }
action-orc-engine = { path = "engine", version = "0.1.0" }
action-orc-macros = { path = "macros", version = "0.1.0" }
testresult = "0.4.2"
trybuild = "1.0.121"

[dev-dependencies]
trybuild.workspace = true

[[test]]
name = "compile_tests"
path = "tests/compile_tests.rs"
